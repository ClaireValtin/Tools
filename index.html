<style>
:root {
  --bg-top: #eaf7fb;
  --bg-bot: #b9dfea;
  --blob-1: rgba(120, 220, 230, .55);
  --blob-2: rgba(140, 170, 255, .40);
  --blob-3: rgba(255, 210, 190, .45);
  --glass: rgba(255, 255, 255, .55);
  --glass-2: rgba(255, 255, 255, .72);
  --tile: rgba(255, 255, 255, .80);
  --tile-hi: rgba(255, 255, 255, .96);
  --field: rgba(255, 255, 255, .6);
  --glass-edge: rgba(255, 255, 255, .85);
  --hair: rgba(20, 70, 90, .10);
  --text: #0e2a33;
  --muted: #4c6e78;
  --faint: #7f9ca4;
  --accent: #0b8a99;
  --accent-2: #3a7bd5;
  --shadow: 0 1px 1px rgba(10,50,70,.04), 0 12px 32px -12px rgba(10,60,80,.22);
  --wave-1: rgba(255, 255, 255, .30);
  --wave-2: rgba(120, 200, 215, .22);
  --wave-3: rgba(60, 160, 185, .22);
  --wave-4: rgba(20, 120, 150, .26);
  --wave-line: rgba(255, 255, 255, .7);
  --contour: rgba(255, 255, 255, .0);
  --bubble: rgba(255, 255, 255, .8);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-top: #071a26;
    --bg-bot: #04101a;
    --blob-1: rgba(30, 160, 180, .35);
    --blob-2: rgba(70, 90, 220, .30);
    --blob-3: rgba(30, 200, 160, .18);
    --glass: rgba(20, 45, 60, .45);
    --glass-2: rgba(30, 60, 78, .6);
    --tile: rgba(20, 44, 58, .78);
    --tile-hi: rgba(30, 62, 80, .92);
    --field: rgba(120, 200, 215, .10);
    --glass-edge: rgba(160, 230, 240, .14);
    --hair: rgba(160, 230, 240, .10);
    --text: #e4f5f8;
    --muted: #9cc0c8;
    --faint: #6a8e97;
    --accent: #4fd8e0;
    --accent-2: #7aa7ff;
    --shadow: 0 1px 1px rgba(0,0,0,.2), 0 16px 40px -14px rgba(0,0,0,.6);
    --wave-1: rgba(60, 180, 200, .06);
    --wave-2: rgba(40, 150, 180, .09);
    --wave-3: rgba(30, 120, 160, .13);
    --wave-4: rgba(20, 90, 130, .2);
    --wave-line: rgba(120, 230, 240, .25);
    --contour: rgba(0,0,0,0);
    --bubble: rgba(160, 235, 245, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg-top: #071a26;
  --bg-bot: #04101a;
  --blob-1: rgba(30, 160, 180, .35);
  --blob-2: rgba(70, 90, 220, .30);
  --blob-3: rgba(30, 200, 160, .18);
  --glass: rgba(20, 45, 60, .45);
  --glass-2: rgba(30, 60, 78, .6);
  --tile: rgba(20, 44, 58, .78);
  --tile-hi: rgba(30, 62, 80, .92);

  --hair: rgba(160, 230, 240, .10);
  --text: #e4f5f8;
  --muted: #9cc0c8;
  --faint: #6a8e97;
  --accent: #4fd8e0;
  --accent-2: #7aa7ff;

  --wave-2: rgba(40, 150, 180, .09);

  --wave-4: rgba(20, 90, 130, .2);

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background:
    radial-gradient(600px 420px at 12% 18%, var(--blob-1), transparent 70%),
    radial-gradient(560px 460px at 88% 8%, var(--blob-2), transparent 70%),
    radial-gradient(520px 380px at 70% 70%, var(--blob-3), transparent 70%),
    linear-gradient(180deg, var(--bg-top), var(--bg-bot));
  background-attachment: fixed;
  color: var(--text);
  font: 15px/1.5 "Plus Jakarta Sans", system-ui, sans-serif;
  min-height: 100vh; overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 0 16px; }
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid var(--glass-edge);
  box-shadow: var(--shadow);
}

/* ---------- top bar: identity · search · theme, always in reach ---------- */
header { position: sticky; top: 0; z-index: 5; padding: 14px 0 10px; }
.bar { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 999px; }
.who { display: inline-flex; align-items: center; gap: 10px; padding: 0 8px 0 0; font-size: 13px; color: var(--muted); white-space: nowrap; }
.who .av { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.who h1 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: -.01em; color: var(--text); }
.search { position: relative; flex: 1; min-width: 0; display: flex; border-radius: 999px; background: var(--field); border: 1px solid var(--hair); }
.search input { width: 100%; height: 42px; border: 0; background: none; border-radius: 999px; padding: 0 44px 0 42px; color: var(--text); font: inherit; font-size: 15px; }
.search input::placeholder { color: var(--faint); }
.search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--faint); }
.search kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); }
kbd { font: 600 11px/1 ui-monospace, monospace; color: var(--faint); border: 1px solid var(--hair); border-radius: 6px; padding: 4px 6px; background: var(--glass); }
.search input:focus ~ kbd { display: none; }
.theme-btn { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 0; background: none; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
.theme-btn:hover { background: var(--field); color: var(--accent); }
.theme-btn svg { width: 18px; height: 18px; }

/* ---------- groups of tiles ---------- */
main { padding: 10px 0 40px; }
.group { margin-top: 22px; }
.group-h { display: flex; align-items: center; gap: 8px; margin: 0 4px 10px; font-size: 12px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.group-h .dot { width: 9px; height: 9px; border-radius: 3px; background: linear-gradient(135deg, var(--c1), var(--c2)); }
.group-h .n { font-weight: 600; letter-spacing: 0; color: var(--faint); }
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }

[data-cat="variants"] { --c1: #0b8a99; --c2: #3a7bd5; }
[data-cat="seq"]      { --c1: #5b54d6; --c2: #9461e6; }
[data-cat="clinic"]   { --c1: #c94a4a; --c2: #df7a36; }
[data-cat="lab"]      { --c1: #1c8f63; --c2: #4aa83f; }
[data-cat="other"]    { --c1: #54707d; --c2: #7a93a0; }
[data-cat="pinned"]   { --c1: #d19a12; --c2: #e8b93a; }

.tile {
  position: relative; display: flex; align-items: center; gap: 14px;
  min-height: 72px; padding: 12px 12px 12px 14px; border-radius: 18px;
  background: var(--tile);
  -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid var(--glass-edge); box-shadow: var(--shadow);
  transition: transform .18s cubic-bezier(.2,.8,.2,1), background .18s ease, border-color .18s ease;
}
.tile:hover { transform: translateY(-2px); background: var(--tile-hi); border-color: var(--c1); }
.tile:focus-within, .tile.first { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono {
  flex: none; width: 44px; height: 44px; border-radius: 13px;
  display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px;
  background: linear-gradient(135deg, var(--c1), var(--c2));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.3);
}
.txt { min-width: 0; flex: 1; }
.txt h3 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.txt p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.open { text-decoration: none; }
.open::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.open:focus { outline: none; }

/* secondary actions stay out of the way until the tile is hovered */
.acts { position: relative; z-index: 1; flex: none; display: flex; flex-direction: column; gap: 2px; }
.act { width: 30px; height: 30px; border: 0; border-radius: 9px; background: none; color: var(--faint); cursor: pointer; display: grid; place-items: center; opacity: 0; transition: opacity .15s ease; }
.act svg { width: 15px; height: 15px; }
.act:hover { background: var(--field); color: var(--accent); }
.act:focus-visible { outline: 2px solid var(--accent); opacity: 1; }
.tile:hover .act, .tile:focus-within .act { opacity: 1; }
.act.pin[aria-pressed="true"] { opacity: 1; color: #d19a12; }
.act.pin[aria-pressed="true"] svg { fill: currentColor; }
@media (hover: none) { .act { opacity: .7; } }
.tile .enter { flex: none; }

.empty { text-align: center; padding: 48px 16px; margin-top: 22px; border-radius: 18px; color: var(--muted); background: var(--tile); border: 1px solid var(--glass-edge); }
footer { padding: 14px 4px 32px; font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 18px; }
footer a { color: var(--muted); }
.status b { color: var(--text); }
.hidden { display: none !important; }
@media (prefers-reduced-motion: reduce) {
  .tile, .act { transition: none; }
  .tile:hover { transform: none; }
}
@media (max-width: 560px) {
  .who span { display: none; }
  .search kbd { display: none; }
  .search input { padding-right: 16px; }
}

<script>
/* ═══════════════════════════════════════════════════════════════
   SETTINGS — the only part you normally need to edit
   ═══════════════════════════════════════════════════════════════ */

const GITHUB_USER = 'ClaireValtin';

/* Sections of the page, in display order. Each tool goes in the section
   named by its `cat`; anything without one lands in "Other". */
const CATEGORIES = [
  { id: 'variants', label: 'Variants' },
  { id: 'seq',      label: 'Sequencing & primers' },
  { id: 'clinic',   label: 'Clinic & references' },
  { id: 'lab',      label: 'Lab bench' },
  { id: 'other',    label: 'Other' },
];

/* Nice names/descriptions for known tools. Each entry matches repo
   names by regex, so a rename (e.g. Ideograms → Idiograms) still works.
   Leave out `desc` to use the repo's GitHub description.
   Any public repo with GitHub Pages that matches nothing here still gets
   a tile in "Other", using its GitHub description. */
const CATALOG = [
  { match: /variant.?one/i,         name: 'VariantOne',        cat: 'variants',
    desc: 'One variant, every database, one page.' },
  { match: /acmg/i,                 name: 'Atelier ACMG',      cat: 'variants',
    desc: 'ACMG/AMP classification of germline variants.' },
  { match: /nomenclat/i,            name: 'Nomenclature',      cat: 'variants',
    desc: 'Variant converter: HGVS, rsID, VCF, SPDI and gnomAD, in GRCh38 and GRCh37.' },

  { match: /sanger/i,               name: 'SangerScope',       cat: 'seq',
    desc: 'Sanger variant analysis against the MANE reference.' },
  { match: /fennec/i,               name: 'FennecTrace',       cat: 'seq',
    desc: 'AB1 chromatogram viewer.' },
  { match: /ab1|chromat|electroph/i, name: 'AB1 Viewer',       cat: 'seq',
    desc: 'Chromatogram viewer: traces, Phred scores, reverse-complement, select & BLAST.' },
  { match: /primer.?scope/i,        name: 'PrimerScope',       cat: 'seq',
    desc: 'Sanger and nested PCR primer design, with SNP check.' },
  { match: /gene.?doc/i,            name: 'GeneDoc',           cat: 'seq',
    desc: 'MANE gene sequence and CDS, exported to Word.' },

  { match: /hpo/i,                  name: 'HPO Picker',        cat: 'clinic',
    desc: 'Browse HPO terms, tick a patient\'s phenotype, export the list.' },
  { match: /pedigree/i,             name: 'PedigreeFes',       cat: 'clinic',
    desc: 'Pedigree drawing editor.' },
  { match: /id[ei]ogram/i,          name: 'Idiograms',         cat: 'clinic',
    desc: 'Chromosome idiograms, FISH probes and ISCN builder.' },
  { match: /globin/i,               name: 'GlobinConsole',     cat: 'clinic',
    desc: 'HBB genotypes and haemoglobin electrophoresis, interpreted.' },
  { match: /mucovisc|cftr/i,        name: 'Mucoviscidose',     cat: 'clinic',
    desc: 'CFTR variant lookup and cystic fibrosis guide.' },
  { match: /hcs.?atlas/i,           name: 'HCSAtlas',          cat: 'clinic',
    desc: 'Congenital adrenal hyperplasia quick reference.' },
  { match: /spectr|onco/i,          name: 'Spectres tumoraux', cat: 'clinic',
    desc: 'Hereditary cancer syndromes: tumour spectra by gene or organ.' },

  { match: /calculat/i,             name: 'CalculatorGen',     cat: 'lab',
    desc: 'Lab calculators: NGS dilution, culture seeding volume, CML residual disease.' },
  { match: /^lmc$/i,                name: 'LMC',               cat: 'lab' },
  { match: /culture.?oh/i,          name: 'Culture OH',        cat: 'lab' },
  { match: /inventor|stock/i,       name: 'Lab inventory',     cat: 'lab',
    desc: 'Consumption and restocking of lab products.' },

  { match: /ledger|expense|budget/i, name: 'Ledger',           cat: 'other',
    desc: 'Expenses and savings tracker.' },
];

/* Repos to never show (exact repo names, case-insensitive).
   The repo hosting this page is also hidden automatically. */
const HIDE = [
  'Tools',
];

/* Sites that are NOT GitHub Pages repos (e.g. later, on your home server).
   Example: { name: 'Inventory (home)', url: 'https://…', cat: 'lab', desc: '…' } */
const MANUAL = [
  { name: 'Primer Inventory', url: 'https://primer-inventory.rehiouisoufiyan.workers.dev/',
    cat: 'seq', desc: 'PCR and sequencing primer catalogue, with linked PCR protocols.',
    code: 'https://github.com/ClaireValtin/PrimerInventory' },
];

/* Shown only if GitHub can't be reached AND nothing is cached yet. */
const FALLBACK = [
  { repo: 'Idiograms', url: 'https://clairevaltin.github.io/Idiograms/',
    code: 'https://github.com/ClaireValtin/Idiograms' },
  { repo: 'SangerScope', url: 'https://clairevaltin.github.io/SangerScope/',
    code: 'https://github.com/ClaireValtin/SangerScope' },
];

/* ═══════════════════════════════════════════════════════════════ */

const CACHE_KEY = 'tools-launcher:repos:v1';
const user = GITHUB_USER.toLowerCase();
const $ = (id) => document.getElementById(id);
const PINS_KEY = 'tools-launcher:pins';
const grid = $('grid'), statusEl = $('status'), q = $('q');
const catLabel = (id) => (CATEGORIES.find((c) => c.id === id) || {}).label || '';
$('ghLink').href = `https://github.com/${GITHUB_USER}?tab=repositories`;
$('year').textContent = new Date().getFullYear();

/* On <user>.github.io/<Repo>/, <Repo> is this launcher itself. */
const SELF_REPO = location.hostname.endsWith('.github.io')
  ? decodeURIComponent(location.pathname.split('/')[1] || '') : '';

let tools = [];

/* ---------- storage (always guarded) ---------- */
function store(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (_) {}
}
function load(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch (_) { return null; }
}
const pins = new Set(Array.isArray(load(PINS_KEY)) ? load(PINS_KEY) : []);

/* ---------- theme ---------- */
const themeListeners = [];
(function initTheme() {
  const saved = load('tools-launcher:theme');
  if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
  $('themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    store('tools-launcher:theme', next);
    themeListeners.forEach((fn) => fn());
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => themeListeners.forEach((fn) => fn()));
})();

/* ---------- background: swell, depth contours and bubbles, drawn on a canvas ---------- */
(function scene() {
  const cv = $('scene'), ctx = cv.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const rnd = (a, b) => a + Math.random() * (b - a);
  let W = 0, H = 0, col = {}, bubbles = [], t = 0, last = 0;

  // back → front; y is the wave's rest line as a fraction of the viewport height
  const WAVES = [
    { y: .70, amp: 16, len: 260, sp: .010, c: '--wave-1' },
    { y: .76, amp: 14, len: 200, sp: -.014, c: '--wave-2' },
    { y: .83, amp: 12, len: 160, sp: .018, c: '--wave-3' },
    { y: .90, amp: 10, len: 120, sp: -.022, c: '--wave-4' },
  ];
  const bubble = (bottom) => ({ x: rnd(0, W), y: bottom ? H + rnd(4, 60) : rnd(H * .5, H),
                                r: rnd(1.5, 4.5), vy: rnd(.35, .9), ph: rnd(0, 6.3) });

  function colors() {
    col = { line: css('--wave-line'), contour: css('--contour'), bubble: css('--bubble') };
    WAVES.forEach((w) => { w.fill = css(w.c); });
    if (still) draw();
  }
  function resize() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bubbles = Array.from({ length: Math.max(14, Math.round(W / 45)) }, () => bubble(false));
    colors();
  }
  const surf = (w, x) => H * w.y + w.amp * Math.sin(x / w.len + t * w.sp)
                                   + w.amp * .45 * Math.sin(x / (w.len * .47) - t * w.sp * 1.6);
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // bathymetric contours across the whole page
    ctx.strokeStyle = col.contour; ctx.lineWidth = 1;
    for (let k = 0; k < 9; k++) {
      const base = H * (.06 + k * .075), a = 10 + k * 2, L = 340 - k * 14;
      ctx.beginPath();
      for (let x = 0; x <= W + 12; x += 12) {
        const y = base + a * Math.sin(x / L + k * 1.3 + t * .0016) + a * .5 * Math.sin(x / (L * .37) - k + t * .0011);
        x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }

    // swell
    for (const w of WAVES) {
      ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W + 8; x += 8) ctx.lineTo(x, surf(w, x));
      ctx.lineTo(W, H); ctx.closePath();
      ctx.fillStyle = w.fill; ctx.fill();
      ctx.beginPath();
      for (let x = 0; x <= W + 8; x += 8) x ? ctx.lineTo(x, surf(w, x)) : ctx.moveTo(x, surf(w, x));
      ctx.strokeStyle = col.line; ctx.lineWidth = 1; ctx.stroke();
    }

    // bubbles
    ctx.strokeStyle = col.bubble; ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (const b of bubbles) { ctx.moveTo(b.x + b.r, b.y); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); }
    ctx.stroke();
  }
  function step(now) {
    const dt = Math.min(3, (now - (last || now)) / 16.7); last = now; t += dt;
    for (const b of bubbles) {
      b.ph += .04 * dt; b.y -= b.vy * dt; b.x += Math.sin(b.ph) * .3 * dt;
      if (b.y < H * .62) Object.assign(b, bubble(true));
    }
    draw();
    if (!document.hidden) requestAnimationFrame(step);
  }
  addEventListener('resize', resize);
  themeListeners.push(colors);
  resize();
  if (!still) {
    requestAnimationFrame(step);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) { last = 0; requestAnimationFrame(step); }
    });
  }
})();


/* ---------- data shaping ---------- */
function prettify(repoName) {
  return repoName.replace(/[-_]+/g, ' ').trim().replace(/\b\w/g, (c) => c.toUpperCase());
}
function initials(name) {
  const words = name.replace(/[^A-Za-zÀ-ÿ0-9 ]/g, ' ').trim().split(/\s+/);
  if (words.length > 1) return (words[0][0] + words[1][0]).toUpperCase();
  const w = words[0] || '?';
  const caps = w.match(/[A-Z]/g);          // SangerScope → SS
  if (caps && caps.length >= 2) return caps[0] + caps[1];
  return w.slice(0, 2).toUpperCase();
}
function toTool(r) {
  const meta = CATALOG.find((c) => c.match.test(r.repo)) || {};
  const name = meta.name || prettify(r.repo);
  return {
    name,
    key: r.repo,
    cat: CATEGORIES.some((c) => c.id === meta.cat) ? meta.cat : 'other',
    desc: meta.desc || r.desc || 'No description yet.',
    url: r.url,
    code: r.code || null,
    pushed: r.pushed || null,
    mono: initials(name),
  };
}
function fromApi(list) {
  const hide = new Set(HIDE.concat(SELF_REPO).map((h) => h.toLowerCase()));
  return list
    .filter((r) => !r.fork && !r.archived)
    .filter((r) => r.name.toLowerCase() !== `${user}.github.io`)
    .filter((r) => !hide.has(r.name.toLowerCase()))
    .filter((r) => r.has_pages || (r.homepage && /^https?:\/\//.test(r.homepage)))
    .map((r) => ({
      repo: r.name,
      desc: r.description,
      url: (r.homepage && /^https?:\/\//.test(r.homepage)) ? r.homepage
           : `https://${user}.github.io/${r.name}/`,
      code: r.html_url,
      pushed: r.pushed_at,
    }));
}
function setTools(slim) {
  const hide = new Set(HIDE.concat(SELF_REPO).map((h) => h.toLowerCase()));
  const manual = MANUAL.map((m) => ({
    name: m.name, key: m.name, desc: m.desc || '', url: m.url,
    cat: CATEGORIES.some((c) => c.id === m.cat) ? m.cat : 'other',
    code: m.code || null, pushed: null, mono: initials(m.name),
  }));
  tools = slim.filter((r) => !hide.has(String(r.repo).toLowerCase()))   // also cleans old caches
    .map(toTool).concat(manual).sort((a, b) => a.name.localeCompare(b.name));
  q.placeholder = `Search ${tools.length} tools…`;
  render();
}

/* ---------- rendering ---------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function visible() {
  const term = q.value.trim().toLowerCase();
  if (!term) return tools;
  // best hits first: name starts with the term, then name contains it, then anything else
  const rank = (t) => { const i = t.name.toLowerCase().indexOf(term); return i === 0 ? 0 : i > 0 ? 1 : 2; };
  return tools
    .filter((t) => (t.name + ' ' + t.desc + ' ' + t.url + ' ' + catLabel(t.cat)).toLowerCase().includes(term))
    .sort((a, b) => rank(a) - rank(b));
}
const ICON_CODE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>';
const ICON_STAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/></svg>';
function tile(t, first) {
  const on = pins.has(t.key);
  return `
    <article class="tile${first ? ' first' : ''}" data-cat="${esc(t.cat)}">
      <div class="mono" aria-hidden="true">${esc(t.mono)}</div>
      <div class="txt">
        <h3><a class="open" href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name)}</a></h3>
        <p>${esc(t.desc)}</p>
      </div>
      ${first ? '<kbd class="enter" aria-hidden="true">↵</kbd>' : ''}
      <div class="acts">
        <button class="act pin" type="button" data-key="${esc(t.key)}" aria-pressed="${on}"
          title="${on ? 'Unpin' : 'Pin to top'}" aria-label="${on ? 'Unpin' : 'Pin'} ${esc(t.name)}">${ICON_STAR}</button>
        ${t.code ? `<a class="act" href="${esc(t.code)}" target="_blank" rel="noopener"
          title="Source code" aria-label="Source code of ${esc(t.name)}">${ICON_CODE}</a>` : ''}
      </div>
    </article>`;
}
function group(id, label, list, markFirst) {
  if (!list.length) return '';
  return `
    <section class="group" data-cat="${id}">
      <h2 class="group-h"><span class="dot" aria-hidden="true"></span>${esc(label)} <span class="n">${list.length}</span></h2>
      <div class="tiles">${list.map((t, i) => tile(t, markFirst && i === 0)).join('')}</div>
    </section>`;
}
function render() {
  const list = visible();
  if (!list.length) {
    grid.innerHTML = `<div class="empty">${tools.length ? 'No tool matches that search.' : 'No tools found yet.'}</div>`;
    return;
  }
  if (q.value.trim()) {                          // searching: one flat list, first hit ready for Enter
    grid.innerHTML = group('results', 'Results', list, true);
    return;
  }
  grid.innerHTML =
    group('pinned', 'Pinned', list.filter((t) => pins.has(t.key)), false) +
    CATEGORIES.map((c) => group(c.id, c.label, list.filter((t) => t.cat === c.id), false)).join('');
}
function setStatus(html) { statusEl.innerHTML = html; }

/* ---------- events ---------- */
grid.addEventListener('click', (e) => {
  const b = e.target.closest('.pin'); if (!b) return;
  const key = b.dataset.key;
  pins.has(key) ? pins.delete(key) : pins.add(key);
  store(PINS_KEY, [...pins]);
  render();
});
q.addEventListener('input', render);
q.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {                       // Enter opens the first match
    const first = visible()[0];
    if (first) window.open(first.url, '_blank', 'noopener');
  } else if (e.key === 'Escape') { q.value = ''; render(); q.blur(); }
});
document.addEventListener('keydown', (e) => {    // just start typing: the search box takes it
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const el = document.activeElement;
  if (el === q || (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))) return;
  if (e.key === '/') { e.preventDefault(); q.focus(); }
  else if (e.key.length === 1 && /\S/.test(e.key)) q.focus();
});

/* ---------- boot: cached list first, then refresh from GitHub ---------- */
(async function boot() {
  const cached = load(CACHE_KEY);
  if (cached && Array.isArray(cached.repos)) {
    setTools(cached.repos);
    setStatus(`<b>${tools.length}</b> tools · syncing with GitHub…`);
  } else {
    setStatus('Loading from GitHub…');
  }
  try {
    const res = await fetch(`https://api.github.com/users/${encodeURIComponent(GITHUB_USER)}/repos?per_page=100&sort=pushed`,
      { headers: { Accept: 'application/vnd.github+json' } });
    if (!res.ok) throw new Error(res.status === 403 ? 'GitHub rate limit reached' : `GitHub error ${res.status}`);
    const slim = fromApi(await res.json());
    store(CACHE_KEY, { t: Date.now(), repos: slim });
    setTools(slim);
    setStatus(`<b>${tools.length}</b> tools · synced with GitHub just now`);
  } catch (err) {
    if (cached && Array.isArray(cached.repos)) {
      setStatus(`<b>${tools.length}</b> tools · ${esc(err.message)} — showing list from ${new Date(cached.t).toLocaleDateString()}`);
    } else {
      setTools(FALLBACK);
      setStatus(`${esc(err.message || 'Offline')} — showing the built-in list only`);
    }
  }
})();
</script>
</body>
</html>
