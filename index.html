<style>
:root {
  --bg-top: #eaf7fb;
  --bg-bot: #b9dfea;
  --blob-1: rgba(120, 220, 230, .55);
  --blob-2: rgba(140, 170, 255, .40);
  --blob-3: rgba(255, 210, 190, .45);
  --glass: rgba(255, 255, 255, .55);
  --glass-2: rgba(255, 255, 255, .72);
  --glass-edge: rgba(255, 255, 255, .85);
  --hair: rgba(20, 70, 90, .10);
  --text: #0e2a33;
  --muted: #4c6e78;
  --faint: #7f9ca4;
  --accent: #0b8a99;
  --accent-2: #3a7bd5;
  --shadow: 0 1px 1px rgba(10,50,70,.04), 0 12px 32px -12px rgba(10,60,80,.22);
  --wave-1: rgba(255, 255, 255, .30);
  --wave-2: rgba(120, 200, 215, .22);
  --wave-3: rgba(60, 160, 185, .22);
  --wave-4: rgba(20, 120, 150, .26);
  --wave-line: rgba(255, 255, 255, .7);
  --contour: rgba(255, 255, 255, .0);
  --bubble: rgba(255, 255, 255, .8);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-top: #071a26;
    --bg-bot: #04101a;
    --blob-1: rgba(30, 160, 180, .35);
    --blob-2: rgba(70, 90, 220, .30);
    --blob-3: rgba(30, 200, 160, .18);
    --glass: rgba(20, 45, 60, .45);
    --glass-2: rgba(30, 60, 78, .6);
    --glass-edge: rgba(160, 230, 240, .14);
    --hair: rgba(160, 230, 240, .10);
    --text: #e4f5f8;
    --muted: #9cc0c8;
    --faint: #6a8e97;
    --accent: #4fd8e0;
    --accent-2: #7aa7ff;
    --shadow: 0 1px 1px rgba(0,0,0,.2), 0 16px 40px -14px rgba(0,0,0,.6);
    --wave-1: rgba(60, 180, 200, .06);
    --wave-2: rgba(40, 150, 180, .09);
    --wave-3: rgba(30, 120, 160, .13);
    --wave-4: rgba(20, 90, 130, .2);
    --wave-line: rgba(120, 230, 240, .25);
    --contour: rgba(0,0,0,0);
    --bubble: rgba(160, 235, 245, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg-top: #071a26;
  --bg-bot: #04101a;
  --blob-1: rgba(30, 160, 180, .35);
  --blob-2: rgba(70, 90, 220, .30);
  --blob-3: rgba(30, 200, 160, .18);
  --glass: rgba(20, 45, 60, .45);
  --glass-2: rgba(30, 60, 78, .6);
  --glass-edge: rgba(160, 230, 240, .14);
  --hair: rgba(160, 230, 240, .10);
  --text: #e4f5f8;
  --muted: #9cc0c8;
  --faint: #6a8e97;
  --accent: #4fd8e0;
  --accent-2: #7aa7ff;
  --shadow: 0 1px 1px rgba(0,0,0,.2), 0 16px 40px -14px rgba(0,0,0,.6);
  --wave-1: rgba(60, 180, 200, .06);
  --wave-2: rgba(40, 150, 180, .09);
  --wave-3: rgba(30, 120, 160, .13);
  --wave-4: rgba(20, 90, 130, .2);
  --wave-line: rgba(120, 230, 240, .25);
  --contour: rgba(0,0,0,0);
  --bubble: rgba(160, 235, 245, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background:
    radial-gradient(600px 420px at 12% 18%, var(--blob-1), transparent 70%),
    radial-gradient(560px 460px at 88% 8%, var(--blob-2), transparent 70%),
    radial-gradient(520px 380px at 70% 70%, var(--blob-3), transparent 70%),
    linear-gradient(180deg, var(--bg-top), var(--bg-bot));
  background-attachment: fixed;
  color: var(--text);
  font: 15px/1.5 "Plus Jakarta Sans", system-ui, sans-serif;
  min-height: 100vh; overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 0 16px; }
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid var(--glass-edge);
  box-shadow: var(--shadow);
}

header { padding: 48px 0 8px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.who { display: inline-flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border-radius: 999px; font-size: 13px; color: var(--muted); }
.who .av { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 800; }
.who b { color: var(--text); font-weight: 700; }
.theme-btn { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
.theme-btn svg { width: 18px; height: 18px; }
h1 { margin: 26px 0 0; font-size: clamp(36px, 6vw, 52px); font-weight: 800; letter-spacing: -.035em; line-height: 1; }
h1 span { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.count { color: var(--faint); font-weight: 500; font-size: .5em; letter-spacing: 0; margin-left: 8px; vertical-align: middle; }

.controls { display: flex; gap: 10px; margin: 26px 0 8px; }
.search { position: relative; flex: 1; display: flex; border-radius: 999px; }
.search input { width: 100%; height: 50px; border: 0; background: none; border-radius: 999px; padding: 0 20px 0 48px; color: var(--text); font: inherit; font-size: 15px; }
.search input::placeholder { color: var(--faint); }
.search input:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
.search svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--faint); }
.view { display: flex; gap: 2px; padding: 4px; border-radius: 999px; }
.view button { width: 42px; border: 0; border-radius: 999px; background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.view button[aria-pressed="true"] { background: var(--glass-2); color: var(--accent); box-shadow: 0 2px 8px -2px rgba(10,60,80,.25); }
.view svg { width: 18px; height: 18px; }
.status { font-size: 12.5px; color: var(--faint); margin: 6px 6px 18px; min-height: 18px; }
.status b { color: var(--muted); }

.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); padding-bottom: 56px; }
.card {
  position: relative; border-radius: 22px; padding: 18px;
  display: flex; flex-direction: column; gap: 12px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid var(--glass-edge); box-shadow: var(--shadow);
  transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s ease, background .25s ease;
}
.card:hover { transform: translateY(-4px); background: var(--glass-2); box-shadow: var(--shadow), 0 24px 40px -20px rgba(11,138,153,.45); }
.card:focus-within { outline: 2px solid var(--accent); outline-offset: 3px; }
.card-top { display: none; }
.card-body { display: flex; flex-direction: column; gap: 12px; flex: 1; }
.card-head { display: flex; gap: 14px; align-items: center; }
.mono {
  flex: none; width: 46px; height: 46px; border-radius: 14px;
  display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 6px 14px -6px rgba(11,138,153,.6);
}
.title { min-width: 0; flex: 1; }
.title h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.open { text-decoration: none; }
.open::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.open:focus { outline: none; }
.desc { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12.5px; color: var(--faint); }
.card-foot .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.code { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; text-decoration: none; color: var(--muted); background: var(--glass-2); border: 1px solid var(--hair); font-weight: 600; }
.code:hover { color: var(--accent); }
.code svg { width: 13px; height: 13px; }

.grid.list { grid-template-columns: 1fr; gap: 10px; }
.grid.list .card { flex-direction: row; align-items: center; padding: 12px 16px; border-radius: 18px; }
.grid.list .card-body { flex-direction: row; align-items: center; gap: 18px; }
.grid.list .card-head { width: 230px; flex: none; }
.grid.list .mono { width: 36px; height: 36px; border-radius: 11px; font-size: 13px; }

.empty { grid-column: 1 / -1; text-align: center; padding: 48px; border-radius: 22px; color: var(--muted); background: var(--glass); }
footer { padding: 18px 4px 32px; font-size: 12.5px; color: var(--faint); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
footer a { color: var(--muted); }
.hidden { display: none !important; }
@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
  .card:hover { transform: none; }
}
@media (max-width: 640px) {
  .grid.list .card { flex-direction: column; align-items: stretch; gap: 10px; }
  .grid.list .card-body { flex-direction: column; align-items: stretch; gap: 6px; }
  .grid.list .card-head { width: auto; }
}

<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <div class="top">
      <div class="who glass"><span class="av">SR</span><b>Soufiyan Rehioui</b> · Medical genetics</div>
      <button class="theme-btn glass" id="themeBtn" type="button" aria-label="Toggle light/dark theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
      </button>
    </div>

      </label>

        <button type="button" data-view="list" aria-pressed="false" aria-label="List"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></button>

<script>
/* ═══════════════════════════════════════════════════════════════
   SETTINGS — the only part you normally need to edit
   ═══════════════════════════════════════════════════════════════ */

const GITHUB_USER = 'ClaireValtin';

/* Nice names/descriptions for known tools. Each entry matches repo
   names by regex, so a rename (e.g. Ideograms → Idiograms) still works.
   Leave out `desc` to use the repo's GitHub description.
   Any public repo with GitHub Pages that matches nothing here still gets
   a card, using its GitHub description. */
const CATALOG = [
  { match: /id[ei]ogram/i,          name: 'Idiograms',
    desc: 'Chromosome idiograms, FISH probes and ISCN builder.' },
  { match: /globin/i,               name: 'GlobinConsole',
    desc: 'HBB genotypes and haemoglobin electrophoresis, interpreted.' },
  { match: /hcs.?atlas/i,           name: 'HCSAtlas',
    desc: 'Congenital adrenal hyperplasia quick reference.' },
  { match: /acmg/i,                 name: 'Atelier ACMG',
    desc: 'ACMG/AMP classification of germline variants.' },
  { match: /variant.?one/i,         name: 'VariantOne',
    desc: 'One variant, every database, one page.' },
  { match: /gene.?doc/i,            name: 'GeneDoc',
    desc: 'MANE gene sequence and CDS, exported to Word.' },
  { match: /primer.?scope/i,        name: 'PrimerScope',
    desc: 'Sanger and nested PCR primer design, with SNP check.' },
  { match: /pedigree/i,             name: 'PedigreeFes',
    desc: 'Pedigree drawing editor.' },
  { match: /mucovisc|cftr/i,        name: 'Mucoviscidose',
    desc: 'CFTR variant lookup and cystic fibrosis guide.' },
  { match: /sanger/i,               name: 'SangerScope',
    desc: 'Sanger variant analysis against the MANE reference.' },
  { match: /fennec/i,               name: 'FennecTrace',
    desc: 'AB1 chromatogram viewer.' },
  { match: /ab1|chromat|electroph/i, name: 'AB1 Viewer',
    desc: 'Chromatogram viewer: traces, Phred scores, reverse-complement, select & BLAST.' },
  { match: /spectr|onco/i,          name: 'Spectres tumoraux',
    desc: 'Hereditary cancer syndromes: tumour spectra by gene or organ.' },
  { match: /^lmc$/i,                name: 'LMC' },
  { match: /culture.?oh/i,          name: 'Culture OH' },
  { match: /inventor|stock/i,       name: 'Lab inventory',
    desc: 'Consumption and restocking of lab products.' },
  { match: /ledger|expense|budget/i, name: 'Ledger',
    desc: 'Expenses and savings tracker.' },
];

/* Repos to never show (exact repo names, case-insensitive).
   The repo hosting this page is also hidden automatically. */
const HIDE = [
  'Tools',
];

/* Sites that are NOT GitHub Pages repos (e.g. later, on your home server).
   Example: { name: 'Inventory (home)', url: 'https://…', desc: '…' } */
const MANUAL = [
  { name: 'Nomenclature', url: 'https://clairevaltin.github.io/Tools/nomenclature/',
    desc: 'Variant converter: HGVS, rsID, VCF, SPDI, gnomAD, GTEx, AlphaGenome Atlas; GRCh37 ↔ GRCh38; nomenclature FAQ.',
    code: 'https://github.com/ClaireValtin/Tools/tree/main/nomenclature' },
];

/* Shown only if GitHub can't be reached AND nothing is cached yet. */
const FALLBACK = [
  { repo: 'Idiograms', url: 'https://clairevaltin.github.io/Idiograms/',
    code: 'https://github.com/ClaireValtin/Idiograms' },
  { repo: 'SangerScope', url: 'https://clairevaltin.github.io/SangerScope/',
    code: 'https://github.com/ClaireValtin/SangerScope' },
];

/* ═══════════════════════════════════════════════════════════════ */

const CACHE_KEY = 'tools-launcher:repos:v1';
const user = GITHUB_USER.toLowerCase();
const $ = (id) => document.getElementById(id);
const grid = $('grid'), statusEl = $('status'), q = $('q'), viewEl = $('view');
$('ghLink').href = `https://github.com/${GITHUB_USER}?tab=repositories`;
$('year').textContent = new Date().getFullYear();

/* On <user>.github.io/<Repo>/, <Repo> is this launcher itself. */
const SELF_REPO = location.hostname.endsWith('.github.io')
  ? decodeURIComponent(location.pathname.split('/')[1] || '') : '';

let tools = [];

/* ---------- storage (always guarded) ---------- */
function store(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (_) {}
}
function load(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch (_) { return null; }
}

/* ---------- theme ---------- */
const themeListeners = [];
(function initTheme() {
  const saved = load('tools-launcher:theme');
  if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
  $('themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    store('tools-launcher:theme', next);
    themeListeners.forEach((fn) => fn());
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => themeListeners.forEach((fn) => fn()));
})();

/* ---------- background: swell, depth contours and bubbles, drawn on a canvas ---------- */
(function scene() {
  const cv = $('scene'), ctx = cv.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const rnd = (a, b) => a + Math.random() * (b - a);
  let W = 0, H = 0, col = {}, bubbles = [], t = 0, last = 0;

  // back → front; y is the wave's rest line as a fraction of the viewport height
  const WAVES = [
    { y: .70, amp: 16, len: 260, sp: .010, c: '--wave-1' },
    { y: .76, amp: 14, len: 200, sp: -.014, c: '--wave-2' },
    { y: .83, amp: 12, len: 160, sp: .018, c: '--wave-3' },
    { y: .90, amp: 10, len: 120, sp: -.022, c: '--wave-4' },
  ];
  const bubble = (bottom) => ({ x: rnd(0, W), y: bottom ? H + rnd(4, 60) : rnd(H * .5, H),
                                r: rnd(1.5, 4.5), vy: rnd(.35, .9), ph: rnd(0, 6.3) });

  function colors() {
    col = { line: css('--wave-line'), contour: css('--contour'), bubble: css('--bubble') };
    WAVES.forEach((w) => { w.fill = css(w.c); });
    if (still) draw();
  }
  function resize() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bubbles = Array.from({ length: Math.max(14, Math.round(W / 45)) }, () => bubble(false));
    colors();
  }
  const surf = (w, x) => H * w.y + w.amp * Math.sin(x / w.len + t * w.sp)
                                   + w.amp * .45 * Math.sin(x / (w.len * .47) - t * w.sp * 1.6);
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // bathymetric contours across the whole page
    ctx.strokeStyle = col.contour; ctx.lineWidth = 1;
    for (let k = 0; k < 9; k++) {
      const base = H * (.06 + k * .075), a = 10 + k * 2, L = 340 - k * 14;
      ctx.beginPath();
      for (let x = 0; x <= W + 12; x += 12) {
        const y = base + a * Math.sin(x / L + k * 1.3 + t * .0016) + a * .5 * Math.sin(x / (L * .37) - k + t * .0011);
        x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }

    // swell
    for (const w of WAVES) {
      ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W + 8; x += 8) ctx.lineTo(x, surf(w, x));
      ctx.lineTo(W, H); ctx.closePath();
      ctx.fillStyle = w.fill; ctx.fill();
      ctx.beginPath();
      for (let x = 0; x <= W + 8; x += 8) x ? ctx.lineTo(x, surf(w, x)) : ctx.moveTo(x, surf(w, x));
      ctx.strokeStyle = col.line; ctx.lineWidth = 1; ctx.stroke();
    }

    // bubbles
    ctx.strokeStyle = col.bubble; ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (const b of bubbles) { ctx.moveTo(b.x + b.r, b.y); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); }
    ctx.stroke();
  }
  function step(now) {
    const dt = Math.min(3, (now - (last || now)) / 16.7); last = now; t += dt;
    for (const b of bubbles) {
      b.ph += .04 * dt; b.y -= b.vy * dt; b.x += Math.sin(b.ph) * .3 * dt;
      if (b.y < H * .62) Object.assign(b, bubble(true));
    }
    draw();
    if (!document.hidden) requestAnimationFrame(step);
  }
  addEventListener('resize', resize);
  themeListeners.push(colors);
  resize();
  if (!still) {
    requestAnimationFrame(step);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) { last = 0; requestAnimationFrame(step); }
    });
  }
})();


/* ---------- data shaping ---------- */
function prettify(repoName) {
  return repoName.replace(/[-_]+/g, ' ').trim().replace(/\b\w/g, (c) => c.toUpperCase());
}
function initials(name) {
  const words = name.replace(/[^A-Za-zÀ-ÿ0-9 ]/g, ' ').trim().split(/\s+/);
  if (words.length > 1) return (words[0][0] + words[1][0]).toUpperCase();
  const w = words[0] || '?';
  const caps = w.match(/[A-Z]/g);          // SangerScope → SS
  if (caps && caps.length >= 2) return caps[0] + caps[1];
  return w.slice(0, 2).toUpperCase();
}
function toTool(r) {
  const meta = CATALOG.find((c) => c.match.test(r.repo)) || {};
  const name = meta.name || prettify(r.repo);
  return {
    name,
    desc: meta.desc || r.desc || 'No description yet.',
    url: r.url,
    code: r.code || null,
    pushed: r.pushed || null,
    mono: initials(name),
  };
}
function fromApi(list) {
  const hide = new Set(HIDE.concat(SELF_REPO).map((h) => h.toLowerCase()));
  return list
    .filter((r) => !r.fork && !r.archived)
    .filter((r) => r.name.toLowerCase() !== `${user}.github.io`)
    .filter((r) => !hide.has(r.name.toLowerCase()))
    .filter((r) => r.has_pages || (r.homepage && /^https?:\/\//.test(r.homepage)))
    .map((r) => ({
      repo: r.name,
      desc: r.description,
      url: (r.homepage && /^https?:\/\//.test(r.homepage)) ? r.homepage
           : `https://${user}.github.io/${r.name}/`,
      code: r.html_url,
      pushed: r.pushed_at,
    }));
}
function setTools(slim) {
  const hide = new Set(HIDE.concat(SELF_REPO).map((h) => h.toLowerCase()));
  const manual = MANUAL.map((m) => ({
    name: m.name, desc: m.desc || '', url: m.url,
    code: m.code || null, pushed: null, mono: initials(m.name),
  }));
  tools = slim.filter((r) => !hide.has(String(r.repo).toLowerCase()))   // also cleans old caches
    .map(toTool).concat(manual).sort((a, b) => a.name.localeCompare(b.name));
  tools.forEach((t, i) => { t.no = String(i + 1).padStart(2, '0'); });
  $('count').textContent = String(tools.length).padStart(2, '0') + '';
  render();
}

/* ---------- rendering ---------- */
function ago(iso) {
  if (!iso) return '';
  const s = (Date.now() - new Date(iso)) / 1000;
  const units = [[31536000, 'y'], [2592000, 'mo'], [604800, 'w'], [86400, 'd'], [3600, 'h'], [60, 'min']];
  for (const [sec, u] of units) if (s >= sec) return `updated ${Math.floor(s / sec)}${u} ago`;
  return 'updated just now';
}
function shortUrl(u) {
  try { const x = new URL(u); return (x.host + x.pathname).replace(/\/$/, ''); } catch (_) { return u; }
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function visible() {
  const term = q.value.trim().toLowerCase();
  return tools.filter((t) =>
    !term || (t.name + ' ' + t.desc + ' ' + t.url).toLowerCase().includes(term));
}
function render() {
  const list = visible();
  if (!list.length) {
    grid.innerHTML = `<div class="empty">${tools.length ? 'No tool matches that search.' : 'No tools found yet.'}</div>`;
    return;
  }
  grid.innerHTML = list.map((t, i) => `
    <article class="card" style="--i:${i}">
      <div class="card-top" aria-hidden="true"><span>№ ${t.no}</span><span class="live">Live</span></div>
      <div class="card-body">
        <div class="card-head">
          <div class="mono" aria-hidden="true">${esc(t.mono)}</div>
          <div class="title">
            <h2><a class="open" href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name)}</a></h2>
          </div>
        </div>
        <p class="desc">${esc(t.desc)}</p>
      </div>
      <div class="card-foot">
        <span class="path" title="${esc(t.url)}">${t.pushed ? ago(t.pushed) : esc(shortUrl(t.url))}</span>
        ${t.code ? `<a class="code" href="${esc(t.code)}" target="_blank" rel="noopener" aria-label="Source code of ${esc(t.name)}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>Code</a>` : ''}
      </div>
    </article>`).join('');
}
function setView(v) {
  grid.classList.toggle('list', v === 'list');
  for (const b of viewEl.querySelectorAll('button')) b.setAttribute('aria-pressed', b.dataset.view === v);
}
function setStatus(html) { statusEl.innerHTML = html; }

/* ---------- events ---------- */
setView(load('tools-launcher:view') === 'list' ? 'list' : 'grid');
viewEl.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  setView(b.dataset.view); store('tools-launcher:view', b.dataset.view);
});
q.addEventListener('input', render);
q.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {                       // Enter opens the first match
    const first = visible()[0];
    if (first) window.open(first.url, '_blank', 'noopener');
  } else if (e.key === 'Escape') { q.value = ''; render(); q.blur(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== q && !e.ctrlKey && !e.metaKey) {
    e.preventDefault(); q.focus();
  }
});

/* ---------- boot: cached list first, then refresh from GitHub ---------- */
(async function boot() {
  const cached = load(CACHE_KEY);
  if (cached && Array.isArray(cached.repos)) {
    setTools(cached.repos);
    setStatus(`<b>${tools.length}</b> tools · syncing with GitHub…`);
  } else {
    setStatus('Loading from GitHub…');
  }
  try {
    const res = await fetch(`https://api.github.com/users/${encodeURIComponent(GITHUB_USER)}/repos?per_page=100&sort=pushed`,
      { headers: { Accept: 'application/vnd.github+json' } });
    if (!res.ok) throw new Error(res.status === 403 ? 'GitHub rate limit reached' : `GitHub error ${res.status}`);
    const slim = fromApi(await res.json());
    store(CACHE_KEY, { t: Date.now(), repos: slim });
    setTools(slim);
    setStatus(`<b>${tools.length}</b> tools · synced with GitHub just now`);
  } catch (err) {
    if (cached && Array.isArray(cached.repos)) {
      setStatus(`<b>${tools.length}</b> tools · ${esc(err.message)} — showing list from ${new Date(cached.t).toLocaleDateString()}`);
    } else {
      setTools(FALLBACK);
      setStatus(`${esc(err.message || 'Offline')} — showing the built-in list only`);
    }
  }
})();
</script>
</body>
</html>
